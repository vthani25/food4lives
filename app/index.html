<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Food4Lives</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">

  <main class="landing">
    <h1 class="landing-logo">Food<span>4</span>Lives</h1>
    <p class="tagline">250 meals on the table by 12:30, every day.</p>

    <form class="login-form" onsubmit="return false;">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@email.com">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••">

      <p class="note">No backend yet — pick a portal below to open it.</p>
    </form>

    <p class="choose">Open a portal</p>
    <div class="portal-links">
      <a href="volunteer/today.html">Volunteer Portal</a>
      <a href="admin/command-center.html">Admin Console</a>
      <a href="partner/overview.html">Partner Portal</a>
    </div>

    <p class="signup-links">
      New here?
      <a href="signup/volunteer.html">Volunteer sign-up</a> ·
      <a href="signup/organization.html">Organization sign-up</a>
    </p>
  </main>

</body>
</html>
