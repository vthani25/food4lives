<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer sign-up | Food4Lives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/volunteer.css">
</head>
<body>

  <div class="devbar">
    <strong>DEV</strong>
    <a href="../volunteer/today.html">Volunteer</a>
    <a href="../admin/command-center.html">Admin</a>
    <a href="../partner/overview.html">Partner</a>
    <a href="../signup/volunteer.html">Sign-up</a>
    <a href="../index.html">Landing</a>
    <span class="devbar-note">sign-in bypassed — no backend</span>
  </div>

  <header class="topbar">
    <a class="brand" href="../index.html">Food<span>4</span>Lives</a>
    <span class="badge azure">Sign up</span>
    <a class="logout" href="../index.html">Back to sign in</a>
  </header>

  <div class="shell">
    <nav class="side">
        <a href="volunteer.html" class="active">Volunteer sign-up</a>
        <a href="organization.html">Organization sign-up</a>
    </nav>

    <main class="fade-in">
      <header class="page-head">
        <h1>Become a volunteer</h1>
        <p class="lead">Tell us what you can help with, so we assign you the right tasks.</p>
      </header>

      <section class="card form-card">
        <form onsubmit="return false;">
          <label class="field"><span>Full name</span><input type="text" placeholder="Priya Raman"></label>
          <div class="field-row">
            <label class="field"><span>Phone</span><input type="tel" placeholder="(408) 555-0142"></label>
            <label class="field"><span>Email</span><input type="email" placeholder="you@email.com"></label>
          </div>
          <label class="field"><span>Location / ZIP</span><input type="text" placeholder="Sunnyvale 94086"></label>

          <fieldset>
            <legend>Skills</legend>
            <label class="check"><input type="checkbox"> Cooking</label>
            <label class="check"><input type="checkbox"> Packing</label>
            <label class="check"><input type="checkbox"> Driving</label>
            <label class="check"><input type="checkbox"> Pickup</label>
          </fieldset>

          <div class="field-row">
            <label class="field"><span>Vehicle</span>
              <select><option>No vehicle</option><option>Sedan</option><option>SUV</option><option>Van</option><option>Truck</option></select>
            </label>
            <label class="field"><span>Delivery capacity (boxes)</span><input type="number" placeholder="e.g. 60"></label>
          </div>

          <fieldset>
            <legend>Availability</legend>
            <label class="check"><input type="checkbox"> Weekday mornings</label>
            <label class="check"><input type="checkbox"> Weekday afternoons</label>
            <label class="check"><input type="checkbox"> Weekends</label>
          </fieldset>

          <label class="field"><span>Emergency contact</span><input type="text" placeholder="Name &amp; phone"></label>

          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
      </section>
    </main>
  </div>

</body>
</html>
